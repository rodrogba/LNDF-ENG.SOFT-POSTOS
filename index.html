<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#104473">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Posto Seguro">
    <title>Posto Seguro - Segurança no Abastecimento</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { 
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        input, select, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 68, 115, 0.08);
            box-shadow: 0 4px 20px -2px rgba(16, 68, 115, 0.05);
        }
        #map { 
            width: 100%; 
            height: 100%; 
            background: #f1f5f9; 
            z-index: 10; 
            outline: none;
        }
        .custom-div-icon { 
            background: none !important; 
            border: none !important; 
        }
        .leaflet-container {
            height: 100%;
            width: 100%;
            font-family: inherit;
        }
        .leaflet-tile-container {
            will-change: transform, opacity;
        }
        .leaflet-tile {
            transition: opacity 0.2s ease-in-out !important;
        }
        .leaflet-zoom-animated {
            will-change: transform;
        }
        .brand-blue-bg { background-color: #104473; }
        .brand-blue-text { color: #104473; }
        .brand-blue-border { border-color: #104473; }
        .star-rating { display: flex; gap: 4px; }
        .star-btn { cursor: pointer; transition: transform 0.1s ease; }
        .star-btn:hover { transform: scale(1.2); }
        @keyframes drip-drop {
            0% { transform: translateY(-2px) scale(0.8); opacity: 0; }
            20% { transform: translateY(0px) scale(1); opacity: 1; }
            80% { transform: translateY(12px) scale(0.8) scaleY(1.2); opacity: 0; }
            100% { transform: translateY(12px); opacity: 0; }
        }
        .drip-anim {
            animation: drip-drop 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
            transform-box: fill-box;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const manifest = {
            "name": "Posto Seguro - Combustíveis",
            "short_name": "Posto Seguro",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#104473",
            "icons": [{
                "src": "logo posto_2.png",
                "sizes": "192x192",
                "type": "image/png"
            }]
        };
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(manifestLink);

        const sw = `
            self.addEventListener('install', () => self.skipWaiting());
            self.addEventListener('activate', () => self.clients.claim());
            self.addEventListener('fetch', () => {});
        `;
        const blob = new Blob([sw], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        const { useState, useMemo, useEffect, useRef } = React;

        const Icon = ({ name, size = 18, className = "", color = "currentColor" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size, strokeWidth: 2, stroke: color }}></i>;
        };

        const PostoSeguroIcon = ({ size = 24, pinColor = "#104473", detailColor = "#ffffff" }) => {
            return (
                <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="transition-all duration-300">
                    <path d="M50 92C50 92 84 62.534 84 41.04C84 21.1362 68.7777 5 50 5C31.2223 5 16 21.1362 16 41.04C16 62.534 50 92 50 92Z" fill={pinColor} />
                    <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke={detailColor} strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />
                    <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill={detailColor} />
                    <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill={detailColor} />
                    <path d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill={detailColor} />
                </svg>
            );
        };

        const INITIAL_STATIONS = [
            { id: 1, name: "Posto Shell - Ponta d'Areia", brand: "Shell", prices: { gasolina: 6.45, etanol: 4.79, diesel: 6.10 }, address: "Av. dos Holandeses, Ponta d'Areia", lat: -2.4920, lng: -44.3070, rating: 4.5, reviews: 128, amenities: ["convenience", "carwash", "wifi"], trend: "stable", lastVerified: "Verificado por Carlos S. há 15 min" },
            { id: 6, name: "Posto São Francisco (Shell)", brand: "Shell", prices: { gasolina: 6.42, etanol: 4.65, diesel: 6.15 }, address: "Av. Castelo Branco, São Francisco", lat: -2.5020, lng: -44.3020, rating: 4.1, reviews: 76, amenities: ["convenience", "coffee"], trend: "down", lastVerified: "Confirmado por Amanda R. há 40 min" },
            { id: 2, name: "Posto Ipiranga - Litorânea", brand: "Ipiranga", prices: { gasolina: 6.38, etanol: 4.59, diesel: 5.95 }, address: "Av. Litorânea, Calhau", lat: -2.4860, lng: -44.2790, rating: 4.8, reviews: 256, amenities: ["convenience", "carwash", "wifi", "coffee"], trend: "down", lastVerified: "Verificado por Bruno M. há 5 min" },
            { id: 11, name: "Posto BR - Calhau", brand: "Petrobras", prices: { gasolina: 6.49, etanol: 4.80, diesel: 6.20 }, address: "Av. dos Holandeses, Calhau", lat: -2.4940, lng: -44.2690, rating: 4.3, reviews: 142, amenities: ["convenience", "wifi"], trend: "up", lastVerified: "Verificado por Roberto T. há 2 horas" },
            { id: 3, name: "Posto BR - Renascença", brand: "Petrobras", prices: { gasolina: 6.55, etanol: 4.89, diesel: 6.25 }, address: "Av. Colares Moreira, Renascença II", lat: -2.5010, lng: -44.2910, rating: 4.2, reviews: 89, amenities: ["convenience", "coffee"], trend: "stable", lastVerified: "Verificado por Juliana F. há 1 hora" },
            { id: 12, name: "Posto Shell - Shopping Island", brand: "Shell", prices: { gasolina: 6.50, etanol: 4.85, diesel: 6.18 }, address: "Av. Cel. Colares Moreira, Renascença", lat: -2.5040, lng: -44.3000, rating: 4.0, reviews: 110, amenities: ["convenience", "wifi", "coffee"], trend: "up", lastVerified: "Confirmado por Lucas P. há 22 min" },
            { id: 5, name: "Posto Cohama - Daniel de La Touche", brand: "Petrobras", prices: { gasolina: 6.44, etanol: 4.70, diesel: 6.40 }, address: "Av. Daniel de La Touche, Cohama", lat: -2.5260, lng: -44.2510, rating: 4.0, reviews: 156, amenities: ["convenience", "carwash"], trend: "stable", lastVerified: "Verificado por Marcos G. há 3 horas" },
            { id: 13, name: "Posto Ipiranga - Aririzal", brand: "Ipiranga", prices: { gasolina: 6.35, etanol: 4.55, diesel: 6.05 }, address: "Rua do Aririzal, Cohama", lat: -2.5350, lng: -44.2460, rating: 4.4, reviews: 310, amenities: ["convenience", "wifi", "coffee"], trend: "down", lastVerified: "Confirmado por Thiago V. há 8 min" },
            { id: 8, name: "Posto Turu - São Luís Rei de França", brand: "Petrobras", prices: { gasolina: 6.29, etanol: 4.45, diesel: 5.88 }, address: "Av. São Luís Rei de França, Turu", lat: -2.5150, lng: -44.2310, rating: 4.4, reviews: 189, amenities: ["convenience", "carwash", "wifi"], trend: "down", lastVerified: "Verificado por Patricia L. há 50 min" },
            { id: 15, name: "Posto ALE - Cohatrac", brand: "ALE", prices: { gasolina: 6.32, etanol: 4.49, diesel: 5.80 }, address: "Av. Contorno Sul, Cohatrac IV", lat: -2.5400, lng: -44.2150, rating: 4.1, reviews: 205, amenities: ["convenience"], trend: "stable", lastVerified: "Confirmado por Sandra K. há 1 dia" },
            { id: 7, name: "Posto Cohab - Jerônimo de Albuquerque", brand: "Ipiranga", prices: { gasolina: 6.39, etanol: 4.60, diesel: 5.90 }, address: "Av. Jerônimo de Albuquerque, Cohab", lat: -2.5220, lng: -44.2350, rating: 4.3, reviews: 210, amenities: ["convenience", "coffee"], trend: "down", lastVerified: "Verificado por Daniel S. há 18 min" },
            { id: 4, name: "Posto Cidade Operária (Indep)", brand: "Independente", prices: { gasolina: 6.25, etanol: 4.39, diesel: 5.85 }, address: "Av. Principal, Cidade Operária", lat: -2.5720, lng: -44.2120, rating: 3.9, reviews: 342, amenities: ["carwash"], trend: "stable", lastVerified: "Verificado por Wellington O. há 4 horas" }
        ];

        const BRAND_COLORS = {
            "Shell": { bg: "bg-red-500", text: "text-white", border: "border-yellow-400" },
            "Ipiranga": { bg: "bg-orange-500", text: "text-white", border: "border-blue-600" },
            "Petrobras": { bg: "bg-emerald-600", text: "text-white", border: "border-yellow-400" },
            "ALE": { bg: "bg-red-600", text: "text-white", border: "border-red-800" },
            "Independente": { bg: "bg-slate-700", text: "text-white", border: "border-slate-800" }
        };

        const MapView = ({ stations, onSelect, selectedId, fuelType, lowestPrice, fuelColors }) => {
            const mapRef = useRef(null);
            const markersRef = useRef({});

            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { 
                        zoomControl: false,
                        zoomAnimation: true,
                        fadeAnimation: true,
                        markerZoomAnimation: true,
                        inertia: true,
                        bounceAtZoomLimits: true
                    }).setView([-2.5300, -44.2600], 12);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { 
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                        subdomains: 'abcd',
                        maxZoom: 20,
                        keepBuffer: 6,
                        updateWhenIdle: true,
                        updateWhenZooming: false,
                        unloadInvisibleTiles: false,
                        reuseTiles: true
                    }).addTo(mapRef.current);
                }

                const timer = setTimeout(() => {
                    if (mapRef.current) {
                        mapRef.current.invalidateSize({ animate: false });
                    }
                }, 100);

                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!mapRef.current) return;

                const resizeObserver = new ResizeObserver(() => {
                    if (mapRef.current) {
                        mapRef.current.invalidateSize({ animate: false });
                    }
                });

                const mapElement = document.getElementById('map');
                if (mapElement) {
                    resizeObserver.observe(mapElement);
                }

                return () => {
                    resizeObserver.disconnect();
                };
            }, []);

            useEffect(() => {
                if (!mapRef.current) return;
                
                stations.forEach(station => {
                    const isSelected = selectedId === station.id;
                    const isLowest = station.prices[fuelType] === lowestPrice;
                    
                    let brandColorHex = "#104473";
                    let detailColorHex = "#ffffff";

                    if (isLowest) {
                        brandColorHex = fuelColors.dark;
                    } else if (isSelected) {
                        brandColorHex = "#0f172a";
                    }

                    const markerIconHtml = `
                        <div style="display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 4px 14px rgba(16,68,115,0.22));">
                            <div style="width: 38px; height: 38px;">
                                <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M50 92C50 92 84 62.534 84 41.04C84 21.1362 68.7777 5 50 5C31.2223 5 16 21.1362 16 41.04C16 62.534 50 92 50 92Z" fill="${brandColorHex}" stroke="#ffffff" stroke-width="4" />
                                    <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke="${detailColorHex}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill="${detailColorHex}" />
                                    <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill="${detailColorHex}" />
                                    <path d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill="${detailColorHex}" />
                                </svg>
                            </div>
                            <div style="margin-top: 2px; background: ${isLowest ? fuelColors.dark : '#ffffff'}; 
                                 padding: 3px 8px; border-radius: 8px; font-size: 11px; color: ${isLowest ? '#ffffff' : '#1e293b'}; 
                                 font-weight: 800; white-space: nowrap; border: 1.5px solid ${isLowest ? '#ffffff' : '#cbd5e1'}; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
                                 R$ ${station.prices[fuelType].toFixed(2)}
                            </div>
                        </div>`;

                    const newIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: markerIconHtml,
                        iconSize: [38, 58], 
                        iconAnchor: [19, 44]
                    });

                    if (markersRef.current[station.id]) {
                        markersRef.current[station.id].setIcon(newIcon);
                        markersRef.current[station.id].setLatLng([station.lat, station.lng]);
                    } else {
                        const marker = L.marker([station.lat, station.lng], { icon: newIcon })
                            .addTo(mapRef.current)
                            .on('click', () => { 
                                onSelect(station); 
                                mapRef.current.setView([station.lat, station.lng], 15); 
                            });
                        markersRef.current[station.id] = marker;
                    }
                });

                const currentStationIds = new Set(stations.map(s => s.id));
                Object.keys(markersRef.current).forEach(id => {
                    if (!currentStationIds.has(Number(id))) {
                        markersRef.current[id].remove();
                        delete markersRef.current[id];
                    }
                });

            }, [stations, selectedId, fuelType, lowestPrice, fuelColors]);

            return <div id="map" className="rounded-2xl"></div>;
        };

        const FeedbackModal = ({ station, onClose, onSubmit, fuelType, fuelColors }) => {
            const [rating, setRating] = useState(0);
            const [userName, setUserName] = useState("");
            const [newPrice, setNewPrice] = useState("");
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => {
                    onSubmit(station.id, parseFloat(newPrice.replace(',', '.')), userName);
                }, 2000);
            };

            if (submitted) {
                return (
                    <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                        <div className="bg-white rounded-3xl shadow-2xl p-10 text-center max-w-sm w-full border border-slate-100">
                            <div className="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Icon name="check-circle" size={42} className="text-[#104473]" />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800 tracking-tight">Obrigado!</h2>
                            <p className="text-slate-500 text-sm mt-2">Sua colaboração mantém nossa comunidade atualizada e segura.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-[2000] flex items-end md:items-center justify-center bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white w-full md:max-w-lg md:rounded-3xl rounded-t-[2.5rem] p-6 md:p-8 relative shadow-2xl animate-in slide-in-from-bottom-full md:zoom-in-95 duration-300">
                        <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 md:hidden"></div>
                        <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full">
                            <Icon name="x" size={20} />
                        </button>

                        <div className="mb-6 pr-10 flex items-center gap-3">
                            <PostoSeguroIcon size={40} />
                            <div>
                                <span className="text-[10px] font-bold text-blue-900 uppercase tracking-widest bg-blue-50 px-2.5 py-1 rounded-md">Confirmar Preço</span>
                                <h2 className="text-lg font-bold text-slate-800 mt-1 leading-tight">{station.name}</h2>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <label className="text-xs font-semibold text-slate-600 block mb-2">Qualidade do Atendimento / Estrutura</label>
                                <div className="star-rating">
                                    {[1, 2, 3, 4, 5].map(star => (
                                        <button key={star} type="button" onClick={() => setRating(star)} className="star-btn">
                                            <Icon name="star" size={28} className={star <= rating ? "fill-amber-400 text-amber-400" : "text-slate-300"} />
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="text-xs font-semibold text-slate-600 block mb-1">Seu Nome (Colaborador)</label>
                                <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-2xl px-3 py-1.5 focus-within:border-blue-900 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                                    <Icon name="user" size={16} className="text-slate-400" />
                                    <input type="text" placeholder="Ex: Maria Silva" className="w-full bg-transparent text-sm p-2 text-slate-800 outline-none font-medium" required value={userName} onChange={e => setUserName(e.target.value)} />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs font-semibold text-slate-600 block mb-1">Preço Atual ({fuelType})</label>
                                    <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-2xl px-3 py-1.5 focus-within:border-blue-900 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                                        <span className="text-sm font-semibold text-slate-400">R$</span>
                                        <input type="number" step="0.01" placeholder="Ex: 6.40" className="w-full bg-transparent text-sm p-2 text-slate-800 outline-none font-semibold" required value={newPrice} onChange={e => setNewPrice(e.target.value)} />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-600 block mb-1">Meio de Pagamento</label>
                                    <select className="w-full bg-white border border-slate-200 text-sm p-3.5 rounded-2xl text-slate-800 outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-100 transition-all font-medium">
                                        <option>Dinheiro / PIX</option>
                                        <option>Cartão de Débito</option>
                                        <option>Cartão de Crédito</option>
                                        <option>App do Posto</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" className="w-full py-4 mt-2 font-bold text-sm text-white rounded-2xl hover:bg-opacity-90 active:scale-[0.98] transition-all shadow-lg brand-blue-bg">
                                Confirmar e Enviar
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [stations, setStations] = useState(INITIAL_STATIONS);
            const [searchTerm, setSearchTerm] = useState("");
            const [fuelType, setFuelType] = useState("gasolina");
            const [viewMode, setViewMode] = useState("list");
            const [selectedStation, setSelectedStation] = useState(null);
            const [feedbackStation, setFeedbackStation] = useState(null);
            
            const [installPrompt, setInstallPrompt] = useState(null);
            const [isInstalled, setIsInstalled] = useState(false);

            useEffect(() => {
                const randomNames = ["Carlos S.", "Amanda R.", "Bruno M.", "Roberto T.", "Juliana F.", "Lucas P.", "Marcos G.", "Thiago V.", "Patricia L.", "Sandra K.", "Daniel S.", "Wellington O."];
                const intervalId = setInterval(() => {
                    setStations(prevStations => prevStations.map(station => {
                        if (Math.random() > 0.75) {
                            const variation = (Math.random() * 0.04 - 0.02);
                            const randomName = randomNames[Math.floor(Math.random() * randomNames.length)];
                            
                            return {
                                ...station,
                                prices: {
                                    gasolina: Math.max(5.90, station.prices.gasolina + variation),
                                    etanol: Math.max(3.90, station.prices.etanol + (variation * 0.8)),
                                    diesel: Math.max(4.90, station.prices.diesel + variation)
                                },
                                trend: variation > 0.005 ? "up" : (variation < -0.005 ? "down" : "stable"),
                                lastVerified: `Atualizado por ${randomName} (Ao Vivo)`
                            };
                        }
                        return station;
                    }));
                }, 5000);

                return () => clearInterval(intervalId);
            }, []);

            const handleUpdateStation = (stationId, updatedPrice, userName) => {
                setStations(prev => prev.map(s => {
                    if (s.id === stationId && !isNaN(updatedPrice)) {
                        return {
                            ...s,
                            prices: { ...s.prices, [fuelType]: updatedPrice },
                            lastVerified: `Verificado por ${userName} agora`,
                            trend: updatedPrice < s.prices[fuelType] ? "down" : (updatedPrice > s.prices[fuelType] ? "up" : "stable")
                        };
                    }
                    return s;
                }));
                setFeedbackStation(null);
            };

            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            });

            useEffect(() => {
                if (window.matchMedia('(display-mode: standalone)').matches) {
                    setIsInstalled(true);
                }

                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstallApp = async () => {
                if (!installPrompt) return;
                installPrompt.prompt();
                const { outcome } = await installPrompt.userChoice;
                if (outcome === 'accepted') {
                    setInstallPrompt(null);
                    setIsInstalled(true);
                }
            };

            const fuelColors = useMemo(() => {
                switch(fuelType) {
                    case "gasolina":
                        return { text: "text-rose-600", bg: "bg-rose-50", border: "border-rose-200", dark: "#e11d48", badge: "bg-rose-500" };
                    case "etanol":
                        return { text: "text-emerald-600", bg: "bg-emerald-50", border: "border-emerald-200", dark: "#059669", badge: "bg-emerald-500" };
                    case "diesel":
                        return { text: "text-amber-600", bg: "bg-amber-50", border: "border-amber-200", dark: "#d97706", badge: "bg-amber-500" };
                    default:
                        return { text: "text-[#104473]", bg: "bg-blue-50", border: "border-blue-200", dark: "#104473", badge: "bg-blue-600" };
                }
            }, [fuelType]);

            const lowestPrice = useMemo(() => Math.min(...stations.map(s => s.prices[fuelType])), [stations, fuelType]);

            const filteredStations = useMemo(() => {
                return stations
                    .filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.address.toLowerCase().includes(searchTerm.toLowerCase()))
                    .sort((a, b) => a.prices[fuelType] - b.prices[fuelType]);
            }, [stations, searchTerm, fuelType]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 relative selection:bg-blue-100">
                    <div className="fixed inset-0 pointer-events-none z-0 flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 opacity-[0.06]">
                            <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <pattern id="timbrado-pattern" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
                                        <g transform="scale(1.4) translate(-5, 5)">
                                            <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke="#104473" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                                            <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill="#104473" />
                                            <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill="#104473" />
                                            <path className="drip-anim" style={{animationDelay: '1.5s'}} d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill="#104473" />
                                        </g>
                                    </pattern>
                                    <radialGradient id="fade-gradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
                                        <stop offset="0%" stopColor="#000" stopOpacity="1" />
                                        <stop offset="70%" stopColor="#000" stopOpacity="0.5" />
                                        <stop offset="100%" stopColor="#000" stopOpacity="0" />
                                    </radialGradient>
                                    <mask id="fade-mask">
                                        <rect width="100%" height="100%" fill="url(#fade-gradient)" />
                                    </mask>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#timbrado-pattern)" mask="url(#fade-mask)" />
                            </svg>
                        </div>
                        <div className="w-[140%] max-w-[700px] aspect-square absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.04] mix-blend-multiply">
                            <svg width="100%" height="100%" viewBox="30 10 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                                <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke="#104473" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />
                                <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill="#104473" />
                                <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill="#104473" />
                                <path className="drip-anim" d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill="#104473" />
                            </svg>
                        </div>
                    </div>

                    {feedbackStation && <FeedbackModal station={feedbackStation} onClose={() => setFeedbackStation(null)} onSubmit={handleUpdateStation} fuelType={fuelType} fuelColors={fuelColors} />}

                    <header className="bg-white/95 border-b border-slate-200 pt-safe-top sticky top-0 z-30 shadow-sm backdrop-blur-md">
                        {installPrompt && !isInstalled && (
                            <div className="bg-[#104473] px-4 py-2.5 flex items-center justify-between border-b border-blue-900">
                                <div className="flex items-center gap-2">
                                    <PostoSeguroIcon size={18} detailColor="#ffffff" />
                                    <span className="text-xs font-semibold text-white">Instale o aplicativo oficial para acesso rápido</span>
                                </div>
                                <button onClick={handleInstallApp} className="bg-white text-[#104473] text-[10px] font-bold uppercase px-3 py-1.5 rounded-full shadow-sm">
                                    Instalar
                                </button>
                            </div>
                        )}

                        <div className="px-4 py-4 md:px-8 max-w-5xl mx-auto flex flex-col gap-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <img 
                                        src="logo posto_2.png" 
                                        alt="Posto Seguro Logo" 
                                        className="h-14 w-auto object-contain"
                                        onError={(e) => {
                                            e.target.style.display = 'none';
                                            document.getElementById('fallback-logo-container').style.display = 'flex';
                                        }}
                                    />
                                    <div id="fallback-logo-container" className="hidden items-center gap-2">
                                        <PostoSeguroIcon size={40} />
                                        <div>
                                            <h1 className="text-lg font-bold text-[#104473]">Posto Seguro</h1>
                                            <p className="text-[10px] text-zinc-500 font-medium">LNDF Eng. Software</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-right bg-slate-100 px-4 py-2 rounded-2xl border border-slate-200 flex items-center gap-2.5">
                                    <PostoSeguroIcon size={32} pinColor={fuelColors.dark} />
                                    <div>
                                        <span className="text-[9px] font-bold text-slate-500 uppercase block tracking-wider">Menor Preço</span>
                                        <span className={`text-xl font-black ${fuelColors.text}`}>R$ {lowestPrice.toFixed(2)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="relative">
                                <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                                <input type="text" placeholder="Buscar bairro ou posto parceiro em São Luís..." className="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-100 transition-all shadow-inner"
                                    value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>

                            <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4 md:mx-0 md:px-0">
                                {["gasolina", "etanol", "diesel"].map(type => {
                                    const isActive = fuelType === type;
                                    return (
                                        <button key={type} onClick={() => setFuelType(type)} className={`px-6 py-3 rounded-full text-xs font-bold capitalize whitespace-nowrap transition-all flex items-center gap-2 ${isActive ? 'brand-blue-bg text-white shadow-md' : 'bg-white border border-slate-200 text-slate-600 active:bg-slate-50'}`}>
                                            <span className={`w-2.5 h-2.5 rounded-full ${isActive ? 'bg-white' : (type === 'gasolina' ? 'bg-rose-500' : type === 'etanol' ? 'bg-emerald-500' : 'bg-amber-500')}`}></span>
                                            {type}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-5xl mx-auto w-full pb-28 pt-4 z-10 relative">
                        {viewMode === "list" ? (
                            <div className="px-4 md:px-8 grid gap-4">
                                {filteredStations.length > 0 ? filteredStations.map((station, index) => {
                                    const isLowest = station.prices[fuelType] === lowestPrice;
                                    const bColors = BRAND_COLORS[station.brand] || BRAND_COLORS["Independente"];
                                    return (
                                        <div key={station.id} className={`bg-white/90 rounded-3xl border ${isLowest ? 'border-2 shadow-lg' : 'border-slate-100 shadow-sm'} p-5 transition-all relative overflow-hidden`} style={isLowest ? { borderColor: fuelColors.dark, boxShadow: `0 10px 25px -5px ${fuelColors.dark}15` } : {}}>
                                            {isLowest && <div className={`absolute top-0 right-0 text-white text-[9px] font-extrabold px-4 py-1.5 rounded-bl-2xl uppercase tracking-wider ${fuelColors.badge}`}>Melhor Preço</div>}
                                            
                                            <div className="flex justify-between items-start mb-4 pr-20">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                                                        <h3 className="text-base font-bold text-slate-800 leading-tight">{station.name}</h3>
                                                        <span className={`text-[8px] font-extrabold uppercase px-2 py-0.5 rounded-md border ${bColors.bg} ${bColors.text} ${bColors.border}`}>{station.brand}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-500 flex items-center gap-1">
                                                        <Icon name="map-pin" size={12} className="text-slate-400" />
                                                        {station.address}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap items-center gap-4 py-3 border-y border-slate-100 mb-4">
                                                <div className="flex items-center gap-1.5">
                                                    {station.amenities.includes("convenience") && <div className="p-1.5 bg-slate-100 rounded-lg text-slate-600" title="Loja Conveniência"><Icon name="shopping-bag" size={14} /></div>}
                                                    {station.amenities.includes("carwash") && <div className="p-1.5 bg-slate-100 rounded-lg text-slate-600" title="Lavagem"><Icon name="car" size={14} /></div>}
                                                    {station.amenities.includes("wifi") && <div className="p-1.5 bg-slate-100 rounded-lg text-slate-600" title="Wi-Fi Grátis"><Icon name="wifi" size={14} /></div>}
                                                    {station.amenities.includes("coffee") && <div className="p-1.5 bg-slate-100 rounded-lg text-slate-600" title="Cafeteria"><Icon name="coffee" size={14} /></div>}
                                                </div>
                                                <div className={`text-[10px] font-medium ml-auto flex items-center gap-1 transition-colors duration-500 ${station.lastVerified.includes("Ao Vivo") ? 'text-blue-600 animate-pulse' : 'text-slate-400'}`}>
                                                    <Icon name={station.lastVerified.includes("Ao Vivo") ? "radio" : "clock"} size={11} className={station.lastVerified.includes("Ao Vivo") ? "text-blue-500" : "text-slate-300"} /> 
                                                    {station.lastVerified}
                                                </div>
                                            </div>

                                            <div className="flex items-end justify-between">
                                                <div>
                                                    <span className="text-[10px] uppercase font-bold text-slate-400 block mb-0.5">Preço por Litro</span>
                                                    <div className="flex items-center gap-2">
                                                        <div className={`text-2xl font-black tracking-tight ${isLowest ? fuelColors.text : 'text-slate-800'}`}>
                                                            R$ {station.prices[fuelType].toFixed(2).replace('.', ',')}
                                                        </div>
                                                        {station.trend === "down" && <span className="text-xs font-bold text-emerald-500 flex items-center bg-emerald-50 px-1.5 py-0.5 rounded">↘</span>}
                                                        {station.trend === "up" && <span className="text-xs font-bold text-rose-500 flex items-center bg-rose-50 px-1.5 py-0.5 rounded">↗</span>}
                                                        {station.trend === "stable" && <span className="text-xs font-bold text-slate-400 flex items-center bg-slate-50 px-1.5 py-0.5 rounded">→</span>}
                                                    </div>
                                                </div>
                                                
                                                <div className="flex gap-2">
                                                    <button onClick={() => window.open(`https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}`)} className="h-10 w-10 bg-blue-50 text-[#104473] rounded-xl flex items-center justify-center active:bg-blue-100 transition-colors">
                                                        <Icon name="navigation" size={18}/>
                                                    </button>
                                                    <button onClick={() => setFeedbackStation(station)} className="h-10 px-4 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl text-xs font-semibold flex items-center gap-2 active:bg-slate-100 transition-colors">
                                                        <Icon name="edit-3" size={14}/> <span>Atualizar</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                }) : (
                                    <div className="py-20 text-center flex flex-col items-center bg-white rounded-3xl border border-slate-100">
                                        <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400">
                                            <Icon name="search-x" size={28} />
                                        </div>
                                        <h3 className="text-slate-700 font-bold mb-1">Nenhum posto localizado</h3>
                                        <p className="text-slate-500 text-sm">Tente redefinir o termo de busca ou o combustível.</p>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="relative w-full h-[calc(100vh-240px)] md:h-[600px] md:rounded-3xl overflow-hidden shadow-inner border border-slate-200">
                                <MapView stations={filteredStations} onSelect={setSelectedStation} selectedId={selectedStation?.id} fuelType={fuelType} lowestPrice={lowestPrice} fuelColors={fuelColors} />
                                
                                {selectedStation && (
                                    <div className="absolute bottom-6 left-4 right-4 bg-white/95 backdrop-blur-md rounded-2xl p-5 z-[1000] shadow-2xl border border-slate-200 animate-in slide-in-from-bottom-5">
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="pr-4">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <h4 className="font-bold text-slate-800 text-sm leading-tight">{selectedStation.name}</h4>
                                                    <span className={`text-[8px] font-extrabold uppercase px-1.5 py-0.5 rounded border ${BRAND_COLORS[selectedStation.brand]?.bg || 'bg-slate-700'} ${BRAND_COLORS[selectedStation.brand]?.text || 'text-white'} ${BRAND_COLORS[selectedStation.brand]?.border || 'border-slate-800'}`}>{selectedStation.brand}</span>
                                                </div>
                                                <p className="text-slate-500 text-[10px] truncate">{selectedStation.address}</p>
                                            </div>
                                            <button onClick={() => setSelectedStation(null)} className="p-1.5 bg-slate-100 text-slate-500 rounded-full active:bg-slate-200 shrink-0">
                                                <Icon name="x" size={16}/>
                                            </button>
                                        </div>
                                        
                                        <div className="grid grid-cols-3 gap-2 py-3 border-y border-slate-100 mb-4">
                                            <div className="text-center p-2 bg-rose-50 rounded-xl border border-rose-100">
                                                <p className="text-[9px] font-bold text-rose-500 uppercase mb-0.5">Gasolina</p>
                                                <p className="text-sm font-black text-slate-800">R$ {selectedStation.prices.gasolina.toFixed(2)}</p>
                                            </div>
                                            <div className="text-center p-2 bg-emerald-50 rounded-xl border border-emerald-100">
                                                <p className="text-[9px] font-bold text-emerald-500 uppercase mb-0.5">Etanol</p>
                                                <p className="text-sm font-black text-slate-800">R$ {selectedStation.prices.etanol.toFixed(2)}</p>
                                            </div>
                                            <div className="text-center p-2 bg-amber-50 rounded-xl border border-amber-100">
                                                <p className="text-[9px] font-bold text-amber-500 uppercase mb-0.5">Diesel</p>
                                                <p className="text-sm font-black text-slate-800">R$ {selectedStation.prices.diesel.toFixed(2)}</p>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between">
                                            <button onClick={() => setFeedbackStation(selectedStation)} className="px-4 py-2.5 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl text-xs font-semibold flex items-center gap-2 active:bg-slate-100 transition-colors">
                                                <Icon name="edit-3" size={14}/> Atualizar
                                            </button>
                                            <button onClick={() => window.open(`https://www.google.com/maps/dir/?api=1&destination=${selectedStation.lat},${selectedStation.lng}`)} className="brand-blue-bg px-5 py-2.5 rounded-xl text-white text-xs font-bold flex items-center gap-2 shadow-md active:scale-95 transition-all">
                                                <Icon name="navigation" size={14}/> Traçar Rota
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 pb-safe-bottom z-40">
                        <div className="flex justify-around items-center px-2 pt-2 pb-3 max-w-md mx-auto">
                            <button className={`flex flex-col items-center gap-1 p-2 w-20 transition-colors ${viewMode === 'list' ? 'brand-blue-text' : 'text-slate-400'}`} onClick={() => setViewMode("list")}>
                                <div className={`p-1.5 rounded-xl ${viewMode === 'list' ? 'bg-blue-50' : 'bg-transparent'}`}>
                                    <Icon name="list" size={22} color={viewMode === 'list' ? '#104473' : 'currentColor'} />
                                </div>
                                <span className="text-[10px] font-bold tracking-tight">Economia</span>
                            </button>
                            
                            <div className="relative -top-5">
                                <button onClick={() => setFeedbackStation(stations[0])} className="h-15 w-15 brand-blue-bg text-white rounded-full flex items-center justify-center shadow-lg border-4 border-slate-50 active:scale-95 transition-transform p-3">
                                    <PostoSeguroIcon size={34} pinColor="transparent" detailColor="#ffffff" />
                                </button>
                            </div>

                            <button className={`flex flex-col items-center gap-1 p-2 w-20 transition-colors ${viewMode === 'map' ? 'brand-blue-text' : 'text-slate-400'}`} onClick={() => setViewMode("map")}>
                                <div className={`p-1.5 rounded-xl ${viewMode === 'map' ? 'bg-blue-50' : 'bg-transparent'}`}>
                                    <Icon name="map" size={22} color={viewMode === 'map' ? '#104473' : 'currentColor'} />
                                </div>
                                <span className="text-[10px] font-bold tracking-tight">Mapa</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
