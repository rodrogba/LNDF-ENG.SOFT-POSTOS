    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { 
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        input, select, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(16, 68, 115, 0.08);
        }

        #map { 
            width: 100%; 
            height: 100%; 
            background: #e2e8f0; 
            z-index: 10; 
            outline: none;
        }

        .custom-div-icon { 
            background: none !important; 
            border: none !important; 
        }

        .brand-blue-bg { background-color: #104473; }
        .brand-blue-text { color: #104473; }
        .brand-blue-border { border-color: #104473; }

        .star-rating { display: flex; gap: 4px; }
        .star-btn { cursor: pointer; transition: transform 0.15s ease; }
        .star-btn:hover { transform: scale(1.2); }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.04); }
        }

        .pulse-badge {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>

    <script type="text/babel">

            { id: 8, name: "Posto Turu - São Luís Rei de França", brand: "Petrobras", prices: { gasolina: 6.29, etanol: 4.45, diesel: 5.88 }, address: "Av. São Luís Rei de França, Turu", lat: -2.5150, lng: -44.2310, rating: 4.4, reviews: 189, distanceKm: 7.2, amenities: ["convenience", "carwash", "wifi", "air"], trend: "down", history: [6.38, 6.33, 6.29], lastVerified: "Patricia L. há 50 min" },

            { id: 4, name: "Posto Cidade Operária (Indep)", brand: "Independente", prices: { gasolina: 6.25, etanol: 4.39, diesel: 5.85 }, address: "Av. Principal, Cidade Operária", lat: -2.5720, lng: -44.2120, rating: 3.9, reviews: 342, distanceKm: 12.0, amenities: ["carwash", "air"], trend: "stable", history: [6.28, 6.25, 6.25], lastVerified: "Wellington O. há 4h" }

        const BRAND_COLORS = {
            "Shell": { bg: "bg-red-500", text: "text-red-600", border: "border-amber-400", lightBg: "bg-red-50" },
            "Ipiranga": { bg: "bg-orange-500", text: "text-orange-600", border: "border-blue-600", lightBg: "bg-orange-50" },

        const FUEL_THEMES = {

        const AMENITIES_LABELS = {

            carwash: { label: "Lava-Jato", icon: "car" },
            wifi: { label: "Wi-Fi Grátis", icon: "wifi" },
            coffee: { label: "Café / Lanche", icon: "coffee" },
            air: { label: "Calibrador", icon: "refresh-cw" }
        };

        const Icon = ({ name, size = 18, className = "", color = "currentColor" }) => {
            const icons = {
                "search": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
                "map-pin": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0zM15 11a3 3 0 11-6 0 3 3 0 016 0z" />,
                "list": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />,
                "map": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />,
                "star": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />,
                "user": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
                "x": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
                "check-circle": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "trending-down": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6" />,
                "trending-up": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />,
                "minus": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 12H4" />,
                "navigation": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />,
                "calculator": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />,
                "shield-check": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
                "wifi": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />,
                "car": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h8m-8 4h8m-11 8h14a2 2 0 002-2V9a2 2 0 00-2-2h-3l-2-3H9L7 7H4a2 2 0 00-2 2v8a2 2 0 002 2z" />,
                "coffee": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z" />,
                "refresh-cw": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
                "heart": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />,
                "plus": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
                "bar-chart": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
                "share": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />,
                "info": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "compass": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            };

            return (
                <svg className={`inline-block stroke-current fill-none ${className}`} width={size} height={size} viewBox="0 0 24 24" style={{ color: color }}>
                    {icons[name] || <circle cx="12" cy="12" r="8" strokeWidth="2" />}
                </svg>
            );
        };

        const PostoSeguroIcon = ({ size = 32, pinColor = "#104473", detailColor = "#ffffff" }) => {
            return (
                <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 92C50 92 84 62.534 84 41.04C84 21.1362 68.7777 5 50 5C31.2223 5 16 21.1362 16 41.04C16 62.534 50 92 50 92Z" fill={pinColor} />
                    <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke={detailColor} strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />
                    <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill={detailColor} />
                    <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill={detailColor} />
                    <path d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill={detailColor} />
                </svg>
            );
        };

        const MapView = ({ stations, onSelect, selectedId, fuelType, lowestPrice, fuelColors }) => {
            const mapRef = React.useRef(null);
            const markersRef = React.useRef({});

            React.useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { 
                        zoomControl: false,
                        zoomAnimation: true,
                        fadeAnimation: true,
                        markerZoomAnimation: true,
                        inertia: true
                    }).setView([-2.5200, -44.2600], 12);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { 
                        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(mapRef.current);
                }

                const timer = setTimeout(() => {
                    if (mapRef.current) {
                        mapRef.current.invalidateSize({ animate: false });
                    }
                }, 100);

                return () => clearTimeout(timer);
            }, []);

            React.useEffect(() => {
                if (!mapRef.current) return;
                
                stations.forEach(station => {
                    const isSelected = selectedId === station.id;
                    const isLowest = station.prices[fuelType] === lowestPrice;
                    
                    let brandColorHex = "#104473";
                    let detailColorHex = "#ffffff";

                    if (isLowest) {
                        brandColorHex = fuelColors.dark;
                    } else if (isSelected) {
                        brandColorHex = "#0f172a";
                    }

                    const markerIconHtml = `
                        <div style="display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 4px 12px rgba(16,68,115,0.25)); cursor: pointer;">
                            <div style="width: 38px; height: 38px;">
                                <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M50 92C50 92 84 62.534 84 41.04C84 21.1362 68.7777 5 50 5C31.2223 5 16 21.1362 16 41.04C16 62.534 50 92 50 92Z" fill="${brandColorHex}" stroke="#ffffff" stroke-width="4" />
                                    <path d="M51.5 24C41 24 38.5 35 50 39C61.5 43 59 55.5 48.5 55.5C39.5 55.5 39 49 39 49" stroke="${detailColorHex}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M55.5 25.5L68 18.5L72.5 23L61 30.5L55.5 25.5Z" fill="${detailColorHex}" />
                                    <path d="M68 18.5L78 15L79.5 17.5L70.5 20.5L68 18.5Z" fill="${detailColorHex}" />
                                    <path d="M79.5 25.5C79.5 28 78 30 76 30C74 30 72.5 28 72.5 25.5C72.5 23 76 19.5 76 19.5C76 19.5 79.5 23 79.5 25.5Z" fill="${detailColorHex}" />
                                </svg>
                            </div>
                            <div style="margin-top: 2px; background: ${isLowest ? fuelColors.dark : '#ffffff'}; 
                                         padding: 3px 8px; border-radius: 8px; font-size: 11px; color: ${isLowest ? '#ffffff' : '#1e293b'}; 
                                         font-weight: 800; white-space: nowrap; border: 1.5px solid ${isLowest ? '#ffffff' : '#cbd5e1'}; box-shadow: 0 2px 6px rgba(0,0,0,0.12);">
                                R$ ${station.prices[fuelType].toFixed(2)}
                            </div>
                        </div>`;

                    const newIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: markerIconHtml,
                        iconSize: [38, 58], 
                        iconAnchor: [19, 44]
                    });

                    if (markersRef.current[station.id]) {
                        markersRef.current[station.id].setIcon(newIcon);
                        markersRef.current[station.id].setLatLng([station.lat, station.lng]);
                    } else {
                        const marker = L.marker([station.lat, station.lng], { icon: newIcon })
                            .addTo(mapRef.current)
                            .on('click', () => { 
                                onSelect(station); 
                                mapRef.current.setView([station.lat, station.lng], 15, { animate: true }); 
                            });
                        markersRef.current[station.id] = marker;
                    }
                });

                const currentStationIds = new Set(stations.map(s => s.id));
                Object.keys(markersRef.current).forEach(id => {
                    if (!currentStationIds.has(Number(id))) {
                        markersRef.current[id].remove();
                        delete markersRef.current[id];
                    }
                });

            }, [stations, selectedId, fuelType, lowestPrice, fuelColors]);

            return <div id="map" className="rounded-2xl h-full w-full"></div>;
        };

        const StationDetailModal = ({ station, onClose, onToggleFavorite, isFavorite, onOpenFeedback, fuelType }) => {
            if (!station) return null;

            const handleShare = () => {
                const text = `Confira os preços no ${station.name}: Gasolina R$ ${station.prices.gasolina.toFixed(2)}, Etanol R$ ${station.prices.etanol.toFixed(2)}! Verificado via Posto Legal.`;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                    alert("Informações do posto copiadas para a área de transferência!");
                }
            };

            return (
                <div className="fixed inset-0 z-[2000] flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4">
                    <div className="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 relative shadow-2xl animate-in slide-in-from-bottom-full sm:zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto no-scrollbar">
                        <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
                        
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <span className="text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded bg-blue-50 text-blue-900">
                                    {station.brand}
                                </span>
                                <h2 className="text-xl font-bold text-slate-800 leading-tight mt-1">{station.name}</h2>
                                <p className="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
                                    <Icon name="map-pin" size={13} className="text-slate-400" />
                                    {station.address}
                                </p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={() => onToggleFavorite(station.id)}

                        {/* Prices Grid */}
                        <div className="grid grid-cols-3 gap-2 my-4">

                                <span className="text-lg font-black text-slate-900">R$ {station.prices.gasolina.toFixed(2)}</span>
                            </div>
                            <div className={`p-3 rounded-2xl border text-center ${fuelType === 'etanol' ? 'bg-sky-50 border-sky-300' : 'bg-slate-50 border-slate-100'}`}>
                                <span className="text-[10px] font-bold text-slate-500 uppercase block">Etanol</span>
                                <span className="text-lg font-black text-slate-900">R$ {station.prices.etanol.toFixed(2)}</span>
                            </div>
                            <div className={`p-3 rounded-2xl border text-center ${fuelType === 'diesel' ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-100'}`}>
                                <span className="text-[10px] font-bold text-slate-500 uppercase block">Diesel</span>
                                <span className="text-lg font-black text-slate-900">R$ {station.prices.diesel.toFixed(2)}</span>
                            </div>
                        </div>

                        {/* History chart preview */}
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-4">
                            <h4 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center justify-between">
                                <span>Histórico Recente (Gasolina)</span>
                                <span className="text-[10px] text-slate-400">Últimos 3 registros</span>
                            </h4>
                            <div className="flex items-end justify-between h-16 pt-2 px-4 border-b border-slate-200">
                                {station.history.map((val, idx) => (
                                    <div key={idx} className="flex flex-col items-center gap-1">
                                        <span className="text-[10px] font-bold text-slate-600">R$ {val.toFixed(2)}</span>
                                        <div 
                                            className="w-8 bg-blue-900/80 rounded-t-md transition-all" 
                                            style={{ height: `${((val - 5.5) / 1.5) * 40 + 12}px` }}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Amenities */}
                        <div className="mb-5">
                            <h4 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Comodidades Disponíveis</h4>
                            <div className="flex flex-wrap gap-2">
                                {station.amenities.map(key => {
                                    const item = AMENITIES_LABELS[key] || { label: key, icon: "info" };
                                    return (
                                        <span key={key} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">
                                            <Icon name={item.icon} size={14} className="text-slate-500" />
                                            {item.label}
                                        </span>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                            <button 
                                onClick={handleShare}
                                className="py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5">
                                <Icon name="share" size={16} /> Compartilhar
                            </button>
                            <button 
                                onClick={() => { onClose(); onOpenFeedback(station); }}
                                className="py-3 rounded-xl brand-blue-bg text-white font-bold text-xs flex items-center justify-center gap-1.5">
                                <Icon name="check-circle" size={16} /> Atualizar Preço
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const FeedbackModal = ({ station, onClose, onSubmit, fuelType }) => {
            const [rating, setRating] = React.useState(5);
            const [userName, setUserName] = React.useState("");
            const [newPrice, setNewPrice] = React.useState(station.prices[fuelType].toFixed(2));
            const [submitted, setSubmitted] = React.useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => {
                    const parsed = parseFloat(String(newPrice).replace(',', '.'));
                    onSubmit(station.id, isNaN(parsed) ? station.prices[fuelType] : parsed, userName || "Motorista Anônimo");
                }, 1200);
            };

            if (submitted) {
                return (
                    <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full border border-slate-100 animate-in zoom-in-95 duration-200">
                            <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <Icon name="check-circle" size={40} />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">Preço Confirmado!</h2>
                            <p className="text-slate-500 text-sm mt-2">Obrigado por ajudar a comunidade de São Luís com dados transparentes.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-[2000] flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4">
                    <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 relative shadow-2xl animate-in slide-in-from-bottom-full sm:zoom-in-95 duration-300">
                        <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
                        <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full transition-colors">
                            <Icon name="x" size={18} />
                        </button>

                        <div className="mb-5 pr-8 flex items-center gap-3">
                            <PostoSeguroIcon size={36} />
                            <div>
                                <span className="text-[10px] font-bold text-blue-900 uppercase tracking-widest bg-blue-50 px-2 py-0.5 rounded">
                                    Atualização Colaborativa
                                </span>
                                <h2 className="text-lg font-bold text-slate-800 leading-tight mt-0.5">{station.name}</h2>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                <label className="text-xs font-bold text-slate-600 block mb-1.5">Avaliação da Estrutura</label>
                                <div className="star-rating">
                                    {[1, 2, 3, 4, 5].map(star => (
                                        <button key={star} type="button" onClick={() => setRating(star)} className="star-btn p-1">
                                            <Icon name="star" size={26} className={star <= rating ? "fill-amber-400 text-amber-400" : "text-slate-300"} />
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Seu Nome / Apelido</label>
                                <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-blue-800 transition-all">
                                    <Icon name="user" size={16} className="text-slate-400" />
                                    <input type="text" placeholder="Ex: Lucas M." className="w-full bg-transparent text-sm p-2 text-slate-800 outline-none font-medium" value={userName} onChange={e => setUserName(e.target.value)} required />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Preço Atual ({fuelType.toUpperCase()})</label>
                                    <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-blue-800 transition-all">
                                        <span className="text-xs font-bold text-slate-400">R$</span>
                                        <input type="number" step="0.01" placeholder="6.35" className="w-full bg-transparent text-sm p-2 text-slate-800 outline-none font-bold" value={newPrice} onChange={e => setNewPrice(e.target.value)} required />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Pagamento</label>
                                    <select className="w-full bg-slate-50 border border-slate-200 text-xs p-3 rounded-xl text-slate-800 outline-none font-medium">
                                        <option>PIX / Dinheiro</option>
                                        <option>Débito</option>
                                        <option>Crédito</option>
                                        <option>App de Fidelidade</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" className="w-full py-3.5 mt-2 font-bold text-sm text-white rounded-xl brand-blue-bg hover:opacity-95 transition-all shadow-md">
                                Confirmar Preço
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AddStationModal = ({ onClose, onAdd }) => {
            const [name, setName] = React.useState("");
            const [brand, setBrand] = React.useState("Shell");
            const [address, setAddress] = React.useState("");
            const [gasolina, setGasolina] = React.useState("6.40");
            const [etanol, setEtanol] = React.useState("4.60");
            const [diesel, setDiesel] = React.useState("6.10");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name || !address) return;

                const newStation = {
                    id: Date.now(),
                    name,
                    brand,
                    address,
                    lat: -2.5100 + (Math.random() - 0.5) * 0.08,
                    lng: -44.2500 + (Math.random() - 0.5) * 0.08,
                    prices: {
                        gasolina: parseFloat(gasolina) || 6.40,
                        etanol: parseFloat(etanol) || 4.60,
                        diesel: parseFloat(diesel) || 6.10
                    },
                    rating: 5.0,
                    reviews: 1,
                    distanceKm: 3.5,
                    amenities: ["convenience", "air"],
                    trend: "stable",
                    history: [parseFloat(gasolina) || 6.40],
                    lastVerified: "Cadastrado agora por você"
                };

                onAdd(newStation);
            };

            return (
                <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-6 max-w-md w-full relative shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto no-scrollbar">
                        <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full">
                            <Icon name="x" size={18} />
                        </button>

                        <div className="flex items-center gap-3 mb-5">
                            <div className="p-3 bg-blue-50 text-blue-900 rounded-2xl">
                                <Icon name="plus" size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">Cadastrar Novo Posto</h3>
                                <p className="text-xs text-slate-500">Adicione um posto não listado à rede</p>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Nome do Posto</label>
                                <input type="text" placeholder="Ex: Posto Renascença Express" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold outline-none focus:border-blue-900" value={name} onChange={e => setName(e.target.value)} required />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Bandeira</label>
                                    <select className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-semibold outline-none" value={brand} onChange={e => setBrand(e.target.value)}>
                                        <option>Shell</option>
                                        <option>Ipiranga</option>
                                        <option>Petrobras</option>
                                        <option>ALE</option>
                                        <option>Independente</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Gasolina (R$)</label>
                                    <input type="number" step="0.01" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold" value={gasolina} onChange={e => setGasolina(e.target.value)} required />
                                </div>
                            </div>

                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Endereço / Bairro</label>
                                <input type="text" placeholder="Ex: Av. Colares Moreira, Renascença" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold outline-none" value={address} onChange={e => setAddress(e.target.value)} required />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Etanol (R$)</label>
                                    <input type="number" step="0.01" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold" value={etanol} onChange={e => setEtanol(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">Diesel (R$)</label>
                                    <input type="number" step="0.01" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold" value={diesel} onChange={e => setDiesel(e.target.value)} required />
                                </div>
                            </div>

                            <button type="submit" className="w-full py-3.5 mt-2 font-bold text-sm text-white rounded-xl brand-blue-bg hover:opacity-95 transition-all">
                                Salvar e Publicar
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const CalculatorsTab = ({ stations }) => {
            const [gasPrice, setGasPrice] = React.useState(6.39);
            const [etanolPrice, setEtanolPrice] = React.useState(4.55);

            // Trip estimator state
            const [distanceKm, setDistanceKm] = React.useState(25);
            const [consumptionKmL, setConsumptionKmL] = React.useState(10);
            
            const ratio = (etanolPrice / gasPrice) * 100;
            const isEtanolBetter = ratio <= 70;

            const litersNeeded = (distanceKm / (consumptionKmL || 1)).toFixed(1);
            const cheapestGasStation = stations.reduce((prev, curr) => curr.prices.gasolina < prev.prices.gasolina ? curr : prev, stations[0]);
            const cheapestGasPrice = cheapestGasStation ? cheapestGasStation.prices.gasolina : 6.25;
            
            const costAtAverage = (litersNeeded * gasPrice).toFixed(2);
            const costAtCheapest = (litersNeeded * cheapestGasPrice).toFixed(2);
            const tripSavings = (costAtAverage - costAtCheapest).toFixed(2);

            return (
                <div className="space-y-6 max-w-3xl mx-auto">
                    {/* Calculator 1: Etanol vs Gasolina */}
                    <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="p-3 bg-blue-50 text-blue-900 rounded-2xl">
                                <Icon name="calculator" size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">Calculadora Flex (Regra dos 70%)</h3>
                                <p className="text-xs text-slate-500">Descubra se compensa abastecer com Etanol ou Gasolina</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-5">
                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Preço da Gasolina (R$)</label>
                                <input type="number" step="0.01" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 outline-none focus:border-blue-900" value={gasPrice} onChange={e => setGasPrice(parseFloat(e.target.value) || 0)} />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Preço do Etanol (R$)</label>
                                <input type="number" step="0.01" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 outline-none focus:border-blue-900" value={etanolPrice} onChange={e => setEtanolPrice(parseFloat(e.target.value) || 0)} />
                            </div>
                        </div>

                        <div className={`p-4 rounded-2xl border ${isEtanolBetter ? 'bg-sky-50 border-sky-200 text-sky-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}`}>
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-xs font-bold uppercase tracking-wider">Resultado da Razão</span>
                                <span className="text-base font-black">{ratio.toFixed(1)}%</span>
                            </div>
                            <p className="text-sm font-bold mt-1">
                                {isEtanolBetter 
                                    ? "🌱 Abasteça com ETANOL! Está custando 70% ou menos do valor da gasolina." 
                                    : "⛽ Abasteça com GASOLINA! O etanol está acima do limite vantajoso de 70%."}
                            </p>
                        </div>
                    </div>

                    {/* Calculator 2: Trip & Savings Estimator */}
                    <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="p-3 bg-emerald-50 text-emerald-700 rounded-2xl">
                                <Icon name="navigation" size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">Simulador de Gastos em Rota</h3>
                                <p className="text-xs text-slate-500">Calcule o custo do seu trajeto e quanto você economiza no melhor posto</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Distância do Percurso (km)</label>
                                <input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 outline-none focus:border-blue-900" value={distanceKm} onChange={e => setDistanceKm(parseFloat(e.target.value) || 0)} />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-600 block mb-1">Consumo Médio do Carro (km/L)</label>
                                <input type="number" step="0.5" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 outline-none focus:border-blue-900" value={consumptionKmL} onChange={e => setConsumptionKmL(parseFloat(e.target.value) || 1)} />
                            </div>
                        </div>

                        <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100 grid grid-cols-2 sm:grid-cols-3 gap-3 text-center">
                            <div>
                                <span className="text-[10px] font-bold text-slate-400 uppercase block">Litros Necessários</span>
                                <span className="text-lg font-black text-slate-800">{litersNeeded} L</span>
                            </div>
                            <div>
                                <span className="text-[10px] font-bold text-slate-400 uppercase block">Custo no Posto Mais Barato</span>
                                <span className="text-lg font-black text-emerald-700">R$ {costAtCheapest}</span>
                            </div>
                            <div className="col-span-2 sm:col-span-1">
                                <span className="text-[10px] font-bold text-slate-400 uppercase block">Economia Estimada</span>
                                <span className="text-lg font-black text-blue-900">R$ {tripSavings > 0 ? tripSavings : "0.00"}</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AnalyticsTab = ({ stations }) => {
            const avgGas = (stations.reduce((acc, s) => acc + s.prices.gasolina, 0) / stations.length).toFixed(2);
            const avgEtanol = (stations.reduce((acc, s) => acc + s.prices.etanol, 0) / stations.length).toFixed(2);
            const avgDiesel = (stations.reduce((acc, s) => acc + s.prices.diesel, 0) / stations.length).toFixed(2);

            return (
                <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="p-3 bg-purple-50 text-purple-700 rounded-2xl">
                                <Icon name="bar-chart" size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">Média de Preços em São Luís</h3>
                                <p className="text-xs text-slate-500">Média atual calculada entre {stations.length} postos monitorados</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 my-4">
                            <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-100 text-center">
                                <span className="text-xs font-bold text-emerald-800 block mb-1">Gasolina Comum</span>
                                <span className="text-2xl font-black text-emerald-900">R$ {avgGas}</span>
                                <span className="text-[10px] text-emerald-700 block mt-1">Preço Médio</span>
                            </div>
                            <div className="p-4 rounded-2xl bg-sky-50 border border-sky-100 text-center">
                                <span className="text-xs font-bold text-sky-800 block mb-1">Etanol</span>
                                <span className="text-2xl font-black text-sky-900">R$ {avgEtanol}</span>
                                <span className="text-[10px] text-sky-700 block mt-1">Preço Médio</span>
                            </div>
                            <div className="p-4 rounded-2xl bg-amber-50 border border-amber-100 text-center">
                                <span className="text-xs font-bold text-amber-800 block mb-1">Diesel S10</span>
                                <span className="text-2xl font-black text-amber-900">R$ {avgDiesel}</span>
                                <span className="text-[10px] text-amber-700 block mt-1">Preço Médio</span>
                            </div>
                        </div>

                        <div className="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-600 flex items-start gap-3">
                            <Icon name="info" size={20} className="text-blue-800 shrink-0 mt-0.5" />
                            <div>
                                <strong className="font-bold text-slate-800">Dica de Economia:</strong> Abastecer no posto com menor valor em relação à média geral pode gerar uma economia de até <strong className="text-emerald-700">R$ 20,00 por tanque cheio (50L)</strong>.
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [stations, setStations] = React.useState(INITIAL_STATIONS);
            const [searchTerm, setSearchTerm] = React.useState("");
            const [fuelType, setFuelType] = React.useState("gasolina");
            const [viewMode, setViewMode] = React.useState("list"); // list | map
            const [activeTab, setActiveTab] = React.useState("explore"); // explore | calc | analytics | favorites
            const [selectedStation, setSelectedStation] = React.useState(null);
            const [detailStation, setDetailStation] = React.useState(null);
            const [feedbackStation, setFeedbackStation] = React.useState(null);
            const [showAddModal, setShowAddModal] = React.useState(false);
            const [brandFilter, setBrandFilter] = React.useState("all");
            const [sortBy, setSortBy] = React.useState("price"); // price | distance | rating
            const [favorites, setFavorites] = React.useState([2, 8]);
            const [toastMessage, setToastMessage] = React.useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Community real-time price updates simulation
            React.useEffect(() => {
                const names = ["Carlos S.", "Amanda R.", "Bruno M.", "Roberto T.", "Juliana F.", "Lucas P.", "Marcos G."];
                const interval = setInterval(() => {
                    setStations(prev => {
                        const randomIndex = Math.floor(Math.random() * prev.length);
                        const newStations = [...prev];
                        const target = newStations[randomIndex];
                        const randomUser = names[Math.floor(Math.random() * names.length)];
                        
                        newStations[randomIndex] = {
                            ...target,
                            lastVerified: `${randomUser} agora mesmo`
                        };
                        return newStations;
                    });
                }, 18000);

                return () => clearInterval(interval);
            }, []);

            const toggleFavorite = (id) => {
                setFavorites(prev => {
                    const isFav = prev.includes(id);
                    if (isFav) {
                        showToast("Posto removido dos favoritos");
                        return prev.filter(item => item !== id);
                    } else {
                        showToast("Posto adicionado aos favoritos!");
                        return [...prev, id];
                    }
                });
            };

            const filteredStations = React.useMemo(() => {
                return stations
                    .filter(st => {
                        const matchesSearch = st.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                              st.address.toLowerCase().includes(searchTerm.toLowerCase());
                        const matchesBrand = brandFilter === "all" || st.brand === brandFilter;
                        const matchesFav = activeTab !== "favorites" || favorites.includes(st.id);
                        return matchesSearch && matchesBrand && matchesFav;
                    })
                    .sort((a, b) => {
                        if (sortBy === "price") return a.prices[fuelType] - b.prices[fuelType];
                        if (sortBy === "distance") return a.distanceKm - b.distanceKm;
                        if (sortBy === "rating") return b.rating - a.rating;
                        return 0;
                    });
            }, [stations, searchTerm, fuelType, brandFilter, sortBy, activeTab, favorites]);

            const lowestPrice = React.useMemo(() => {
                if (filteredStations.length === 0) return 0;
                return Math.min(...filteredStations.map(s => s.prices[fuelType]));
            }, [filteredStations, fuelType]);

            const handleFeedbackSubmit = (stationId, newPrice, userName) => {
                setStations(prev => prev.map(s => {
                    if (s.id === stationId) {
                        return {
                            ...s,
                            prices: { ...s.prices, [fuelType]: newPrice },
                            history: [...s.history.slice(1), newPrice],
                            lastVerified: `Verificado por ${userName} agora`
                        };
                    }
                    return s;
                }));
                setFeedbackStation(null);
                showToast("Obrigado! O preço foi atualizado na rede.");
            };

            const handleAddStation = (newStation) => {
                setStations(prev => [newStation, ...prev]);
                setShowAddModal(false);
                showToast("Novo posto cadastrado com sucesso!");
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 pb-16">
                    {/* Toast Alert Banner */}
                    {toastMessage && (
                        <div className="fixed top-4 right-4 left-4 sm:left-auto z-[3000] bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-slate-700 animate-in fade-in slide-in-from-top-4">
                            <Icon name="check-circle" size={16} className="text-emerald-400" />
                            {toastMessage}
                        </div>
                    )}

                    {/* Header */}
                    <header className="sticky top-0 z-50 glass-panel px-4 py-3">
                        <div className="max-w-5xl mx-auto flex flex-col gap-3">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2.5">
                                    <PostoSeguroIcon size={34} />
                                    <div>
                                        <div className="flex items-center gap-1.5">
                                            <h1 className="text-lg font-black tracking-tight text-slate-800">POSTO LEGAL</h1>
                                            <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded-md flex items-center gap-1">
                                                <Icon name="shield-check" size={12} /> Verificado
                                            </span>
                                        </div>
                                        <p className="text-[11px] font-medium text-slate-500">São Luís e Região • Preços Transparentes</p>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowAddModal(true)} 
                                    className="py-2 px-3 rounded-xl brand-blue-bg text-white hover:opacity-90 font-bold text-xs flex items-center gap-1.5 shadow-sm transition-all">
                                    <Icon name="plus" size={16} />
                                    <span className="hidden sm:inline">Cadastrar Posto</span>
                                </button>
                            </div>

                            {/* Main Tabs Header Navigation */}
                            <div className="flex border-b border-slate-200/80 gap-6 text-xs font-bold pt-1">
                                <button 
                                    onClick={() => setActiveTab("explore")}
                                    className={`pb-2.5 flex items-center gap-1.5 transition-all ${activeTab === 'explore' ? 'border-b-2 brand-blue-border brand-blue-text' : 'text-slate-500 hover:text-slate-800'}`}>
                                    <Icon name="compass" size={16} /> Explorar
                                </button>
                                <button 
                                    onClick={() => setActiveTab("calc")}
                                    className={`pb-2.5 flex items-center gap-1.5 transition-all ${activeTab === 'calc' ? 'border-b-2 brand-blue-border brand-blue-text' : 'text-slate-500 hover:text-slate-800'}`}>
                                    <Icon name="calculator" size={16} /> Calculadoras
                                </button>
                                <button 
                                    onClick={() => setActiveTab("analytics")}
                                    className={`pb-2.5 flex items-center gap-1.5 transition-all ${activeTab === 'analytics' ? 'border-b-2 brand-blue-border brand-blue-text' : 'text-slate-500 hover:text-slate-800'}`}>
                                    <Icon name="bar-chart" size={16} /> Análise
                                </button>
                                <button 
                                    onClick={() => setActiveTab("favorites")}
                                    className={`pb-2.5 flex items-center gap-1.5 transition-all ${activeTab === 'favorites' ? 'border-b-2 brand-blue-border brand-blue-text' : 'text-slate-500 hover:text-slate-800'}`}>
                                    <Icon name="heart" size={16} /> Favoritos ({favorites.length})
                                </button>
                            </div>

                            {/* Filters Bar (Only on Explore / Favorites tabs) */}
                            {(activeTab === "explore" || activeTab === "favorites") && (
                                <div className="space-y-2 pt-1">
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <div className="relative flex-1">
                                            <Icon name="search" size={18} className="absolute left-3.5 top-3 text-slate-400" />
                                            <input 
                                                type="text" 
                                                placeholder="Buscar por bairro, rua ou nome..." 
                                                className="w-full bg-slate-100 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-blue-900 outline-none font-medium"
                                                value={searchTerm}
                                                onChange={e => setSearchTerm(e.target.value)}
                                            />
                                        </div>

                                        <div className="flex gap-2">
                                            {/* Fuel Selector */}
                                            <div className="flex bg-slate-100 p-1 rounded-xl flex-1 sm:flex-none">
                                                {Object.keys(FUEL_THEMES).map(type => (
                                                    <button 
                                                        key={type}
                                                        onClick={() => setFuelType(type)}
                                                        className={`px-3 py-1.5 rounded-lg text-xs font-bold capitalize transition-all ${fuelType === type ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                                                        {type}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* View Toggle */}
                                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                                <button 
                                                    onClick={() => setViewMode("list")}
                                                    className={`p-2 rounded-lg transition-all ${viewMode === "list" ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>
                                                    <Icon name="list" size={18} />
                                                </button>
                                                <button 
                                                    onClick={() => setViewMode("map")}
                                                    className={`p-2 rounded-lg transition-all ${viewMode === "map" ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>
                                                    <Icon name="map" size={18} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Sort & Brand Chips */}
                                    <div className="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar pt-1">
                                        <div className="flex items-center gap-1.5 shrink-0">
                                            <span className="text-[11px] font-bold text-slate-400 mr-1 uppercase">Bandeira:</span>
                                            {["all", "Shell", "Ipiranga", "Petrobras", "ALE", "Independente"].map(brand => (
                                                <button
                                                    key={brand}
                                                    onClick={() => setBrandFilter(brand)}
                                                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${brandFilter === brand ? 'brand-blue-bg text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                                    {brand === "all" ? "Todas" : brand}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="flex items-center gap-1 shrink-0 bg-slate-100 p-1 rounded-lg text-xs font-bold">
                                            <span className="text-[10px] text-slate-400 px-1">Ordem:</span>
                                            <select 
                                                value={sortBy} 
                                                onChange={e => setSortBy(e.target.value)}
                                                className="bg-transparent border-none text-slate-800 font-bold outline-none cursor-pointer">
                                                <option value="price">Menor Preço</option>
                                                <option value="distance">Distância</option>
                                                <option value="rating">Avaliação</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-5xl mx-auto w-full px-4 pt-4 flex-1">
                        {activeTab === "calc" && <CalculatorsTab stations={stations} />}
                        
                        {activeTab === "analytics" && <AnalyticsTab stations={stations} />}

                        {(activeTab === "explore" || activeTab === "favorites") && (
                            <>
                                {/* Stats Banner */}
                                <div className="bg-gradient-to-r from-blue-900 to-slate-900 rounded-2xl p-4 text-white mb-4 shadow-lg flex items-center justify-between">
                                    <div>
                                        <span className="text-[10px] font-bold tracking-widest uppercase text-blue-200 bg-blue-800/60 px-2 py-0.5 rounded">Menor Preço Encontrado</span>
                                        <div className="text-2xl font-black mt-0.5">
                                            R$ {lowestPrice.toFixed(2)} <span className="text-xs font-normal text-blue-200">/ litro de {FUEL_THEMES[fuelType].name}</span>
                                        </div>
                                    </div>
                                    <div className="hidden sm:block text-right">
                                        <div className="text-xs text-blue-200 font-medium">Postos Exibidos</div>
                                        <div className="text-lg font-bold">{filteredStations.length} postos em São Luís</div>
                                    </div>
                                </div>

                                {viewMode === "map" ? (
                                    <div className="h-[calc(100vh-280px)] min-h-[400px] w-full rounded-2xl overflow-hidden shadow-md border border-slate-200 relative">
                                        <MapView 
                                            stations={filteredStations}
                                            onSelect={(st) => setSelectedStation(st)}
                                            selectedId={selectedStation?.id}
                                            fuelType={fuelType}
                                            lowestPrice={lowestPrice}
                                            fuelColors={FUEL_THEMES[fuelType]}
                                        />
                                        {selectedStation && (
                                            <div className="absolute bottom-4 left-4 right-4 z-[1000] bg-white rounded-2xl p-4 shadow-xl border border-slate-100 flex justify-between items-center animate-in slide-in-from-bottom-5">
                                                <div>
                                                    <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">Selecionado no Mapa</span>
                                                    <h4 className="font-bold text-slate-800 text-sm mt-0.5">{selectedStation.name}</h4>
                                                    <p className="text-xs text-slate-500">{selectedStation.address}</p>
                                                </div>
                                                <div className="text-right flex flex-col items-end gap-1">
                                                    <span className="text-lg font-black text-slate-900">R$ {selectedStation.prices[fuelType].toFixed(2)}</span>
                                                    <button 
                                                        onClick={() => setDetailStation(selectedStation)} 
                                                        className="px-3 py-1 bg-blue-900 text-white rounded-lg text-xs font-bold">
                                                        Ver Detalhes
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {filteredStations.map(station => {
                                            const isLowest = station.prices[fuelType] === lowestPrice;
                                            const brandStyle = BRAND_COLORS[station.brand] || BRAND_COLORS["Independente"];
                                            const isFav = favorites.includes(station.id);

                                            return (
                                                <div 
                                                    key={station.id} 
                                                    className={`bg-white rounded-2xl p-4 shadow-sm border transition-all hover:shadow-md relative flex flex-col justify-between ${isLowest ? 'border-emerald-500 ring-2 ring-emerald-100' : 'border-slate-200'}`}>
                                                    
                                                    {isLowest && (
                                                        <div className="absolute -top-2.5 right-4 bg-emerald-600 text-white text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full shadow-sm pulse-badge">
                                                            ★ Mais Barato
                                                        </div>
                                                    )}

                                                    <div>
                                                        <div className="flex items-start justify-between gap-2 mb-2">
                                                            <div className="flex items-center gap-1.5">
                                                                <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-md ${brandStyle.lightBg} ${brandStyle.text}`}>
                                                                    {station.brand}
                                                                </span>
                                                                <span className="text-[11px] font-semibold text-slate-400">
                                                                    • {station.distanceKm} km
                                                                </span>
                                                            </div>
                                                            <button 
                                                                onClick={() => toggleFavorite(station.id)}
                                                                className="text-slate-300 hover:text-rose-500 transition-colors p-1">
                                                                <Icon name="heart" size={16} className={isFav ? "fill-rose-500 text-rose-500" : ""} />
                                                            </button>
                                                        </div>

                                                        <h3 
                                                            onClick={() => setDetailStation(station)}
                                                            className="font-bold text-slate-800 text-base leading-tight mb-1 cursor-pointer hover:text-blue-900 transition-colors">
                                                            {station.name}
                                                        </h3>
                                                        <p className="text-xs text-slate-500 flex items-center gap-1 mb-3">
                                                            <Icon name="map-pin" size={14} className="text-slate-400 shrink-0" />
                                                            <span className="truncate">{station.address}</span>
                                                        </p>
                                                    </div>

                                                    <div>
                                                        {/* Price highlight */}
                                                        <div 
                                                            onClick={() => setDetailStation(station)}
                                                            className="bg-slate-50 rounded-xl p-3 flex items-center justify-between my-2 border border-slate-100 cursor-pointer hover:bg-slate-100/80 transition-all">
                                                            <div>
                                                                <span className="text-[10px] font-bold text-slate-400 uppercase">{FUEL_THEMES[fuelType].name}</span>
                                                                <div className="text-2xl font-black text-slate-900 leading-none mt-1">
                                                                    R$ {station.prices[fuelType].toFixed(2)}
                                                                </div>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className={`inline-flex items-center gap-0.5 text-xs font-bold ${station.trend === 'down' ? 'text-emerald-600' : station.trend === 'up' ? 'text-rose-600' : 'text-slate-500'}`}>
                                                                    <Icon name={station.trend === 'down' ? 'trending-down' : station.trend === 'up' ? 'trending-up' : 'minus'} size={14} />
                                                                    {station.trend === 'down' ? 'Queda' : station.trend === 'up' ? 'Alta' : 'Estável'}
                                                                </span>
                                                            </div>
                                                        </div>

                                                        <p className="text-[11px] text-slate-400 font-medium mb-3 flex items-center gap-1">
                                                            <Icon name="check-circle" size={13} className="text-emerald-500" />
                                                            {station.lastVerified}
                                                        </p>

                                                        {/* Action buttons */}
                                                        <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                                                            <a 
                                                                href={`https://www.google.com/maps/search/?api=1&query=${station.lat},${station.lng}`} 
                                                                target="_blank" 
                                                                rel="noopener noreferrer"
                                                                className="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center gap-1.5 transition-all">
                                                                <Icon name="navigation" size={14} /> Rotas
                                                            </a>
                                                            <button 
                                                                onClick={() => setFeedbackStation(station)}
                                                                className="py-2 px-3 rounded-xl brand-blue-bg text-white text-xs font-bold flex items-center justify-center gap-1.5 transition-all">
                                                                Confirmar
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {/* Modals */}
                    {detailStation && (
                        <StationDetailModal 
                            station={detailStation}
                            fuelType={fuelType}
                            isFavorite={favorites.includes(detailStation.id)}
                            onToggleFavorite={toggleFavorite}
                            onClose={() => setDetailStation(null)}
                            onOpenFeedback={(st) => setFeedbackStation(st)}
                        />
                    )}

                    {feedbackStation && (
                        <FeedbackModal 
                            station={feedbackStation} 
                            fuelType={fuelType}
                            onClose={() => setFeedbackStation(null)}
                            onSubmit={handleFeedbackSubmit}
                        />
                    )}

                    {showAddModal && (
                        <AddStationModal 
                            onClose={() => setShowAddModal(false)}
                            onAdd={handleAddStation}
                        />
                    )}

                    {/* Footer */}
                    <footer className="mt-12 border-t border-slate-200 bg-white py-6 px-4 text-center text-xs text-slate-500">
                        <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2">
                                <PostoSeguroIcon size={24} />
                                <span className="font-bold text-slate-700">Posto Legal © 2026</span>
                            </div>
                            <p>Plataforma colaborativa de transparência e economia de combustíveis.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
